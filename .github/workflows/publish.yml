name: Publish to PyPI

# 🔴 LEER ANTES DEL PRIMER DISPATCH
# ---------------------------------
# Sólo manual: se corre desde la pestaña Actions, sobre main, con la versión a
# publicar, y esa versión tiene que ser el `__version__` de
# `src/uvd_describe_sdk/version.py`. Ningún evento de git (tag, merge, release)
# dispara este workflow: el tag `vX.Y.Z` se sigue creando después de publicar, y
# no dispara nada.
#
# check -> build -> publish. `check` corre sólo en main, compara la versión y
# corre la suite; `build` arma dist/ sin id-token; `publish` es el ÚNICO job con
# id-token, y espera en el environment `pypi` hasta que el dueño lo aprueba
# (Review deployments).
#
# Pasos del DUEÑO, que no se pueden hacer desde el repo, en ESTE orden:
#
#   1. GitHub → Settings → Environments → New environment → `pypi`
#        Required reviewers:   UltravioletaDAO, con "Prevent self-review"
#        Deployment branches:  Selected branches → sólo `main`
#        "Allow administrators to bypass": apagado
#   2. pypi.org → uvd-describe-sdk → Publishing: el trusted publisher de GitHub
#      de este proyecto tiene que quedar así:
#        Owner:         UltravioletaDAO
#        Repository:    uvd-describe-sdk-python
#        Workflow name: publish.yml
#        Environment:   pypi
#   3. Ruleset de `main` (el del molde: sin borrado, sin force, cambios por PR).
#
# ⚠️ Ni el 1 ni el 2 fallan fuerte si faltan, y por eso el orden importa:
#   · Sin el 1, el primer run CREA el environment `pypi` sin ninguna protección
#     y el job publica sin revisor. GitHub, `manage-environments.md` (leído el
#     2026-09-30): "Running a workflow that references an environment that does
#     not exist will create an environment with the referenced name … the newly
#     created environment will not have any protection rules".
#   · Sin el 2 NO hay un 403: con Environment vacío, PyPI acepta el token de
#     cualquier environment, o de ninguno. pypi/warehouse
#     `warehouse/oidc/models/github.py::_check_environment` (main 8e4dc6d6eb,
#     leído el 2026-09-30): "If we haven't set an environment name for the
#     publisher, we don't need to check this claim". El 2 es lo que hace que
#     PyPI RECHACE todo lo que no salga del environment `pypi`, incluido el
#     camino por tag de la versión anterior de este archivo.
#   ⚠️ Corregido el 2026-09-30, y se deja escrito: este encabezado decía
#   «Environment: (vacío)» y que sin el paso de pypi.org «el job FALLA al subir
#   con un 403». Era cierto para lo que describía —sin publisher no hay subida—
#   pero la tentación ahora es leerlo al revés, «si el publisher no dice `pypi`,
#   da 403», y eso es falso: el publisher que ya existe, vacío, acepta el job
#   nuevo en silencio.
#
# LO QUE CAMBIÓ Y POR QUÉ (2026-09-30, DN-PUB-02)
# ----------------------------------------------
# Hasta 0.7.0 este workflow publicaba también por tag `v*`, sin revisor: los
# runs de v0.5.0, v0.6.1 y v0.7.0 subieron a PyPI solos (gh api
# .../actions/runs). Eso viola la regla del stack: ningún evento de git
# despliega ni publica solo. La forma de acá es la del molde ya migrado,
# `uvd-x402-sdk-python/.github/workflows/publish.yml` (main e043d17a, leído el
# 2026-09-30), con dos diferencias medidas: la versión sale de `version.py` y no
# de `pyproject.toml` (acá es `dynamic`), y `build` corre `twine check`.
#
# POR QUÉ NO HAY NINGÚN TOKEN DE PYPI ACÁ
# ---------------------------------------
# El molde decía "there is no token to steal" y tres líneas más abajo subía con
# twine y un token guardado en el repo: el comentario mentía sobre su propio
# código. Este repo eligió hacer verdadera la afirmación: ninguna credencial de
# larga vida, sólo el token OIDC que GitHub emite por ejecución, dura minutos y
# está atado a ESTE workflow de ESTE repo. Un token de PyPI robado publica
# cualquier versión de cualquier proyecto que alcance, desde cualquier lado,
# hasta que alguien lo rote. ⚠️ Corregido el 2026-09-30: el molde YA migró
# (OIDC, sin twine ni contraseña) y este archivo copia su forma.
#
# 🔴 Un test lo ata: `tests/test_publish_workflow.py` se pone rojo si vuelve un
# disparador que no sea el manual, un tag, un secreto del repo, o si el id-token
# sale del job que espera en `pypi`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar; tiene que ser el __version__ de src/uvd_describe_sdk/version.py"
        required: true
        type: string

permissions:
  contents: read # el job que publica agrega el id-token él mismo

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Los tests corren acá, con permiso de sólo lectura: sus dependencias no están
  # pinneadas, y nada de lo que corren comparte runner con la subida ni con su
  # id-token.
  check:
    name: Rama, versión y tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinneadas por SHA y no por tag: un tag es mutable, y quien controle el
      # repo de la action puede cambiar qué corre adentro de un workflow que
      # tiene permiso de publicar. Los SHA son los del molde, verificados el
      # 2026-09-30 contra el tag que nombra cada comentario.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # El input TIENE que ser `version.__version__`. Sin este chequeo, pedir
      # 0.8.0 sobre un árbol que todavía dice 0.7.0 armaría y subiría otra cosa
      # que la pedida, y un número subido a PyPI queda quemado para siempre.
      # Se lee el ARCHIVO, no se importa el paquete: importar uvd_describe_sdk
      # dispara el __init__ que trae httpx, y en este paso las deps aún no están
      # instaladas — el run 1 del workflow viejo murió con ModuleNotFoundError
      # acá, ANTES de llegar al OIDC que venía a probar.
      - name: La versión del input es la del código
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VER="$(grep -oP '(?<=__version__ = ")[^"]+' src/uvd_describe_sdk/version.py)"
          echo "input=$INPUT_VERSION  version.py=$VER"
          if [ -z "$VER" ] || [ "$INPUT_VERSION" != "$VER" ]; then
            echo "::error::el input ($INPUT_VERSION) no coincide con version.__version__ ($VER)"
            exit 1
          fi

      - name: El paquete conserva su nombre (PyPI confía en este workflow para ese proyecto)
        run: |
          NAME="$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$NAME" != "uvd-describe-sdk" ]; then
            echo "::error::pyproject.toml name $NAME (se esperaba uvd-describe-sdk)"
            exit 1
          fi

      - name: Instalar el SDK con sus deps de test (las mismas que instala ci.yml)
        run: pip install -e ".[dev]"

      - name: El SDK de pagos está de verdad (si no, el test de redes miente)
        run: python -c "import uvd_x402_sdk, uvd_x402_sdk.networks.base; print('uvd-x402-sdk OK')"

      - name: Tests, sin red
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: python -m pytest

  build:
    name: sdist y wheel
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Los nombres son los que PyPI ya tiene para 0.7.0 (medido el 2026-09-30):
      # `uvd_describe_sdk-0.7.0.tar.gz` y `uvd_describe_sdk-0.7.0-py3-none-any.whl`.
      - name: Build, y dist/ tiene exactamente esta versión
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build
          ls -l dist/
          test -f "dist/uvd_describe_sdk-$INPUT_VERSION.tar.gz"
          test -f "dist/uvd_describe_sdk-$INPUT_VERSION-py3-none-any.whl"
          test "$(ls dist/ | wc -l)" -eq 2

      - name: Los artefactos están bien formados
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publicar en PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      # Trusted publishing (OIDC): sin esto GitHub no emite el token y la subida
      # no tiene con qué autenticarse. Es el único job que lo recibe.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publicar por trusted publishing (sin contraseña, sin twine)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
